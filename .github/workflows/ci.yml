name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi==0.115.0 pydantic==2.9.2 python-multipart==0.0.9 aiosqlite==0.20.0 python-dotenv==1.0.1
      - name: Run tests
        run: pytest -q tests/test_decision_engine.py
